[program:tailscaled]
command=/workspace/toolchains/current/bin/tailscaled --tun=userspace-networking --state=/workspace/state/tailscale/tailscaled.state --socket=/workspace/state/tailscale/tailscaled.sock --socks5-server=127.0.0.1:1055
autorestart=true
stdout_logfile=/workspace/state/tailscaled.log
stderr_logfile=/workspace/state/tailscaled-error.log
